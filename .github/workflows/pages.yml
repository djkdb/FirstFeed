# 소개 페이지(site/)를 GitHub Pages 로 배포한다 (결정 2026-10-22 · 소개 페이지). 앱과 분리된 정적 파일이라 빌드 단계가 없다 —
# site/ 를 그대로 올린다. 데모 데이터(site/data · site/img)는 npm run export:demo-site 로 만든 것만 들어간다.
# 저장소 설정 Settings → Pages → Source 가 「GitHub Actions」여야 배포된다(처음 한 번, 사용자).
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
